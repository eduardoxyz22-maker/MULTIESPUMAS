name: Generar Panel Heaven (Kommo → GitHub Pages)

on:
  schedule:
    - cron: '0 14 * * *'    # 10:00 Bolivia (UTC-4)
    - cron: '0 21 * * *'    # 17:00 Bolivia (UTC-4)
  workflow_dispatch:         # botón manual en la pestaña Actions
    inputs:
      month:                 # opcional: regenerar un mes pasado (solo su archivo histórico)
        description: 'Mes a regenerar (1-12, vacío = mes en curso)'
        required: false
        default: ''
      year:
        description: 'Año del mes a regenerar (vacío = año en curso)'
        required: false
        default: ''
  push:
    branches: [ main ]
    paths:
      - 'generar.py'
      - 'panel_template.html'

permissions:
  contents: write            # para hacer commit del HTML regenerado

concurrency:
  group: panel-heaven        # nunca dos corridas a la vez (se pelean por la cuota de Gemini)
  cancel-in-progress: false  # la nueva espera en cola a que termine la actual

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar panel desde Kommo
        env:
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PANEL_WORKER_URL: ${{ secrets.PANEL_WORKER_URL }}
        run: |
          # IA horneada PAUSADA temporalmente para acelerar el ciclo de cambios.
          # Restaurar con: python generar.py --bake-ai
          EXTRA=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            EXTRA="--month ${{ github.event.inputs.month }} --year ${{ github.event.inputs.year || '2026' }}"
            echo "Regenerando mes pasado: $EXTRA"
          fi
          python generar.py $EXTRA

      - name: Commit y push del panel actualizado
        run: |
          git config user.name  "heaven-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html panel.html panel_*.html || true
          # «Sin cambios» y «no se pudo publicar» son dos cosas distintas (informe del 23/09):
          # antes `git push || echo` dejaba la corrida en verde aunque el push fallara, y el
          # panel del día quedaba sin publicar sin que nadie se enterara.
          if git diff --cached --quiet; then echo "sin cambios en el panel: no hay nada que publicar"; exit 0; fi
          git commit -m "Panel $(date -u +'%Y-%m-%d %H:%M') (auto)"
          # Si alguien empujó a main mientras esto corría, el push se rechaza: se trae main y se reintenta.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "el push falló (intento $i): trayendo main y reintentando"
            git pull --rebase origin main || { git rebase --abort || true; }
            sleep $((i*5))
          done
          echo "::error::No se pudo publicar el panel regenerado: el push se rechazó 3 veces."
          exit 1
