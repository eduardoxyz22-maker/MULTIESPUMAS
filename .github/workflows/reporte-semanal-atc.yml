name: Reporte Semanal ATC

# 🛑 APAGADO el 31/10/2026 (dueño: «olvidate de trello ya no lo usamos» → «apagá el reporte semanal atc»): ya no corre solo.
#    Bajaba el tablero de Trello todos los días a las 17:00 y lo guardaba en atc-semanal.csv y reporte-semanal-atc.html.
#    El panel lee atc-semanal.csv como foto final (🔗 Completar con Trello y la fecha de compra del informe de ATC): queda como está.
#    Para correrlo una vez: Actions → «Reporte Semanal ATC» → Run workflow.
on:
  workflow_dispatch:         # solo a mano

concurrency:
  group: reporte-atc
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generar reporte semanal (HTML simple + CSV)
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN:   ${{ secrets.TRELLO_TOKEN }}
        run: python3 generar_reporte_atc.py

      - name: Regenerar bundle Kanban con datos frescos
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_TOKEN:   ${{ secrets.TRELLO_TOKEN }}
        run: python3 generar_reporte_atc_bundle.py

      - name: Publicar todo en un solo commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reporte-semanal-atc.html reporte-atc-20260522.html atc-semanal.csv
          FECHA=$(TZ='America/La_Paz' date '+%d/%m/%Y %H:%M')
          git commit -m "Reporte Semanal ATC $FECHA (auto)" || { echo "sin cambios"; exit 0; }
          git push
