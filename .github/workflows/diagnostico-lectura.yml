name: Diagnóstico de la lectura del panel

# 🩺 Hace la MISMA lectura que el navegador (`list`) y dice qué contestó Google: datos, una
# página de error o nada. El respaldo de Kommo no sirve para esto: usa otra acción, que el
# servidor atiende antes que todo lo demás (29/09, bitácora §4hb).
#
# ⚠️ El repositorio es PÚBLICO y este registro también: el script no imprime ningún dato de
#    clientes (solo códigos, tamaños, tiempos y el texto del error de Google).
on:
  workflow_dispatch:            # a mano: Actions → «Diagnóstico de la lectura del panel» → Run workflow
  push:
    paths:
      - 'herramientas/diagnostico_lectura.py'
      - '.github/workflows/diagnostico-lectura.yml'

permissions:
  contents: write     # (16/10) solo para guardar `stock-cifrado.txt` en una rama de trabajo (nunca en main): ver el último paso

jobs:
  leer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pedir la planilla como el navegador
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
        run: python herramientas/diagnostico_lectura.py
      # 🔐 (16/10) Si el script dejó la planilla CIFRADA (solo se lee con la llave privada, que no está en el repo), se guarda en la
      # rama que lo corrió para poder bajarla. Nunca en main.
      - name: Guardar lo cifrado (solo en una rama de trabajo)
        if: github.ref_name != 'main'
        run: |
          [ -f stock-cifrado.txt ] || { echo "no hay nada cifrado"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock-cifrado.txt
          git commit -m "Planilla cifrada para simular el stock (auto)" || exit 0
          for i in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            sleep $((i * 5)); git pull --rebase origin "${GITHUB_REF_NAME}" || { git rebase --abort || true; }
          done
