name: Inspeccionar quién atiende (solo lectura)

# 📞 ¿Se puede saber quién atiende un celular? (20/11). Busca el número en Kommo y trae los mensajes de chat de un lead,
# comparando con todos los de la cuenta. Solo lectura.
#
# ⚠️ El repositorio es PÚBLICO y este registro también: el script no imprime textos de mensajes, nombres ni teléfonos de
#    clientes (solo cantidades, nombres de campos y la forma de los valores; de los webhooks, solo el host).
on:
  workflow_dispatch:
  push:
    paths:
      - 'herramientas/inspeccionar_atiende.py'
      - '.github/workflows/inspeccionar-atiende.yml'

permissions:
  contents: read

concurrency:
  group: inspeccionar-atiende
  cancel-in-progress: false

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preguntarle a Kommo
        env:
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
        run: python herramientas/inspeccionar_atiende.py
